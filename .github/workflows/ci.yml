name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

jobs:
  lint-typecheck-unit-build:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  data-validation-stub:
    name: Data validation gate stub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run data validation stub
        run: npm run data:validate

  playwright-stub:
    name: Playwright gate stub
    runs-on: ubuntu-latest
    steps:
      - name: Stub
        run: echo "SS-16 will enable Playwright journeys."

  lighthouse-stub:
    name: Lighthouse gate stub
    runs-on: ubuntu-latest
    steps:
      - name: Stub
        run: echo "SS-16 will enforce Lighthouse performance and accessibility budgets."
